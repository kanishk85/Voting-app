<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${campaign.name})}"></head>
<body class="dashboard-page"><header th:replace="~{fragments :: header}"></header>
<main class="dashboard-shell layout-shell">
  <div class="campaign-page-top"><a class="back-link" th:href="@{/admin}">← All campaigns</a><span class="campaign-state" th:classappend="${' state-' + #strings.toLowerCase(campaign.status)}" th:text="${campaign.status}">Open</span></div>
  <section class="campaign-detail-heading"><span class="eyebrow"><span class="eyebrow-line"></span> CAMPAIGN MANAGEMENT</span><h1 th:text="${campaign.name}">Campaign</h1><p th:text="${campaign.tagline}">Description</p><span class="campaign-dates" th:text="|${#temporals.format(campaign.startDate, 'dd MMM yyyy')} — ${#temporals.format(campaign.endDate, 'dd MMM yyyy')}|">Dates</span></section>
  <div class="notice notice-success" th:if="${candidateMessage}" role="status"><span class="notice-indicator"></span><span th:text="${candidateMessage}">Candidate added.</span></div><div class="notice notice-error" th:if="${candidateError}" role="alert"><span class="notice-indicator"></span><span th:text="${candidateError}">Could not add candidate.</span></div>
  <section class="admin-create-panel"><div class="admin-section-heading"><div><span class="eyebrow"><span class="eyebrow-line"></span> CANDIDATES</span><h2>Add a candidate</h2></div></div><form class="add-candidate-form" th:action="@{/admin/campaigns/{id}/candidates(id=${campaign.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="form-field"><label for="candidate-name">Candidate name</label><input class="plain-input" id="candidate-name" name="candidateName" type="text" maxlength="100" required></div><button class="button button-dark" type="submit">Add candidate <span class="arrow-mark">↗</span></button></form><p class="form-helper" th:if="${totalVotes > 0}">Candidates are locked after voting begins.</p></section>
  <section class="results-section admin-campaign-results"><div class="results-heading"><div><span class="eyebrow"><span class="eyebrow-line"></span> RESULTS</span><h2 th:text="|${totalVotes} total votes|">0 total votes</h2></div><strong class="leader-label" th:if="${leader != null and totalVotes > 0}" th:text="|Leader: ${leader.candidate.name}|">Leader</strong></div><p class="empty-state" th:if="${#lists.isEmpty(candidates)}">No candidates added.</p><div class="results-list"><article class="result-row" th:each="candidate,iter : ${candidates}"><div class="result-position" th:text="${iter.count < 10 ? '0' + iter.count : iter.count}">01</div><div class="result-ident"><span class="result-avatar" th:text="${#strings.substring(candidate.name, 0, 1)}">C</span><div><strong th:text="${candidate.name}">Candidate</strong><span th:text="${candidate.affiliation}">Independent</span></div></div><div class="result-bar-wrap"><div class="result-bar-track"><span class="result-bar" th:style="|width: ${totalVotes > 0 ? (candidateVotes[candidate.id] * 100 / totalVotes) : 0}%|"></span></div><span class="result-share" th:text="|${totalVotes > 0 ? (candidateVotes[candidate.id] * 100 / totalVotes) : 0}%|">0%</span></div><strong class="result-votes"><span th:text="${candidateVotes[candidate.id]}">0</span><span th:text="${candidateVotes[candidate.id] == 1 ? 'VOTE' : 'VOTES'}">VOTES</span></strong></article></div></section>
  <form class="campaign-delete-form" th:action="@{/admin/campaigns/{id}/delete(id=${campaign.id})}" method="post" onsubmit="return confirm('Delete this campaign, its candidates, and all votes?')"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="delete-button" type="submit">Delete campaign and all its data</button></form>
</main></body></html>
