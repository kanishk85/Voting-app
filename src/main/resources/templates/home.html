<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Campaigns')}"></head>
<body class="home-page">
<header th:replace="~{fragments :: header}"></header>
<main class="simple-home">
  <section class="campaign-section layout-shell">
    <div class="campaign-section-heading"><h2>Campaigns</h2><span th:text="|${#lists.size(campaigns)} available|">0 available</span></div>
    <p class="empty-state" th:if="${#lists.isEmpty(campaigns)}">No campaigns have been created.</p>
    <div class="campaign-grid" th:unless="${#lists.isEmpty(campaigns)}">
      <a class="campaign-card" th:each="campaign : ${campaigns}" th:href="@{/campaigns/{id}(id=${campaign.id})}">
        <div class="campaign-card-top"><span class="campaign-state" th:classappend="${' state-' + #strings.toLowerCase(campaign.status)}" th:text="${campaign.status}">Open</span></div>
        <h3 th:text="${campaign.name}">Campaign name</h3>
        <span class="campaign-dates" th:text="|${#temporals.format(campaign.startDate, 'dd MMM yyyy')} — ${#temporals.format(campaign.endDate, 'dd MMM yyyy')}|">Dates</span>
      </a>
    </div>
  </section>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
